# Outil ponctuel de la convention `release-versioning` (v1.11), à copier dans .github/workflows/retag-images.yml : ajoute le tag X.Y.Z à chaque
# image GHCR `sha-<7>` qui existe encore, pour les tags v* du repo. Déclenché à la main (workflow_dispatch), jamais par un push : sans effet
# sur workflow-concurrency. Les images absentes sont ignorées (journalisées), jamais un échec. Aperçu avec dry_run = true.
# `images` : noms d'images GHCR séparés par des espaces (défaut : le repo en minuscules ; repos à matrice : une valeur par image).
# GITHUB_TOKEN (packages: write) : aucun secret. Utile après `backfill-versions.mjs --apply tags` ; relançable (imagetools create est idempotent).
name: Retag images with versions

on:
  workflow_dispatch:
    inputs:
      images:
        description: 'Images GHCR (espaces ; vide = le repo en minuscules)'
        required: false
        default: ''
      dry_run:
        description: 'Aperçu seulement'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  retag:
    runs-on: ${{ vars.RUNNER_LABEL || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Retag
        env:
          INPUT_IMAGES: ${{ inputs.images }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPO: ${{ github.repository }}
        run: |
          images="$INPUT_IMAGES"
          [ -n "$images" ] || images="ghcr.io/$(echo "$REPO" | tr '[:upper:]' '[:lower:]')"
          retagged=0; missing=0; skipped=0
          for tag in $(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$'); do
            version="${tag#v}"
            sha7="$(git rev-parse "$tag^{commit}" | cut -c1-7)"
            for image in $images; do
              if docker buildx imagetools inspect "$image:sha-$sha7" >/dev/null 2>&1; then
                if docker buildx imagetools inspect "$image:$version" >/dev/null 2>&1; then
                  skipped=$((skipped + 1)); continue
                fi
                echo "retag $image:sha-$sha7 -> $version"
                if [ "$DRY_RUN" != "true" ]; then
                  docker buildx imagetools create -t "$image:$version" "$image:sha-$sha7"
                fi
                retagged=$((retagged + 1))
              else
                echo "missing $image:sha-$sha7 ($tag)"
                missing=$((missing + 1))
              fi
            done
          done
          echo "[retag-images] dry_run=$DRY_RUN retagged=$retagged already=$skipped missing=$missing"
          echo "retagged=$retagged already=$skipped missing=$missing dry_run=$DRY_RUN" >> "$GITHUB_STEP_SUMMARY"
