name: budget

services:
  budget:
    image: ${IMAGE}:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    ports:
      - '127.0.0.1:3001:3000'
    volumes:
      - budget-data:/app/backend/data

volumes:
  budget-data:
